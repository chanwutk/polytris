services:
  polyis:
    build: .
    container_name: polyis
    tty: true
    environment:
      - TERM=xterm-256color
      - POLYIS_DATA=/polyis-data
      - POLYIS_CACHE=/polyis-cache
      - PYTHONWARNINGS=ignore::UserWarning:numpy._core.getlimits
    volumes:
      - .:/polyis
      - ${HOME}/.gurobi/gurobi.lic:/opt/gurobi/gurobi.lic:ro
      - ${DATA}/polyis-data:/polyis-data
      - ${DATA}/polyis-cache:/polyis-cache
      - ${OTIF_DATASET:-./otif-dataset}:/otif-dataset
      - ${SOTA_RESULTS:-./sota-results}:/sota-results
    tmpfs:
      - /tmp
    network_mode: "host"
    # Shared memory for execution2 (README: Run one configuration with execution2); set SHM_SIZE in .env.
    shm_size: "${SHM_SIZE:-128gb}"
