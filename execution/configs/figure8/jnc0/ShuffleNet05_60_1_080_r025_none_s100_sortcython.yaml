# Figure 8 full-Tetris point, B3D 1 (jnc0): reported 100.3 fps, HOTA 0.7886.
params:
  sample_rate: 1
  relevance_threshold: 0.25
  mistrack_tolerance: 0.8
  tile_padding: none
  tracker: sortcython
  tile_size: 60
  canvas_scale: 1.0
  canvas_format: jpeg
artifacts:
  classifier:
    name: ShuffleNet05
    weights: /polyis-cache/jnc0/indexing/training/results/ShuffleNet05_60/model_best.pth
    compilation_benchmark: /polyis-cache/jnc0/indexing/training/results/ShuffleNet05_60/model_compilation.jsonl
  never_relevant_bitmap: /polyis-cache/jnc0/indexing/always_relevant/60_all.npy
  detector:
    type: retina
    config_path: /polyis/configs/retinanet.json
  max_rate_table: /polyis-cache/jnc0/indexing/track_rate/sortcython_60/max_rate_table.npy
system:
  queue_maxsize: 2
  stages:
    decode:
      procs: 2
    classify:
      procs: 1
      gpu: 0
    pack:
      procs: 2
    detect:
      procs: 1
      gpu: 0
    track:
      procs: 2
    prune:
      procs: 1
