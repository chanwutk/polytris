# CalDoT2 (caldot2-y05): the paper's fastest configuration within 5% HOTA loss,
# ShuffleNet05_60_1_r050_square_s100_bytetrackcython (from measurements-results/r1o3_clean_extraction_timing).
params:
  sample_rate: 1
  relevance_threshold: 0.5
  mistrack_tolerance: null
  tile_padding: square
  tracker: bytetrackcython
  tile_size: 60
  canvas_scale: 1.0
  canvas_format: jpeg
artifacts:
  classifier:
    name: ShuffleNet05
    weights: /polyis-cache/caldot2-y05/indexing/training/results/ShuffleNet05_60/model_best.pth
    compilation_benchmark: /polyis-cache/caldot2-y05/indexing/training/results/ShuffleNet05_60/model_compilation.jsonl
  never_relevant_bitmap: /polyis-cache/caldot2-y05/indexing/always_relevant/60_all.npy
  detector:
    type: ultralytics
    model_path: /polyis-data/training/ultralytics/caldot2/weights/yolov5x6/weights/best.pt
system:
  queue_maxsize: 2
  stages:
    decode:
      procs: 2
    classify:
      procs: 1
      gpu: 0
    pack:
      procs: 2
    detect:
      procs: 1
      gpu: 0
    track:
      procs: 2
